<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brussy Barbería - Reservas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a1a1a;
      --accent: #c9a961;
      --light: #f5f5f5;
      --text: #333;
      --border: #e0e0e0;
      --shadow: rgba(0, 0, 0, 0.1);
      --error: #e53935;
      --success: #43a047;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 20px 0;
      position: relative;
      overflow: hidden;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo {
      max-height: 80px;
      filter: brightness(1.1) contrast(1.1);
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .header-info {
      text-align: right;
    }

    .header-info h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header-info p {
      font-size: 16px;
      opacity: 0.8;
    }

    .ticker {
      background-color: var(--accent);
      color: var(--primary);
      padding: 10px 0;
      overflow: hidden;
      position: relative;
    }

    .ticker-track {
      display: flex;
      animation: ticker 20s linear infinite;
      width: fit-content;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker span, .ticker b {
      padding: 0 15px;
      font-weight: 600;
    }

    main {
      padding: 40px 0;
    }

    .booking-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 30px;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 15px var(--shadow);
      margin-bottom: 25px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .kicker {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }

    .date-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .ticket {
      min-width: 80px;
      padding: 15px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .ticket:hover, .ticket.active {
      border-color: var(--accent);
      background-color: rgba(201, 169, 97, 0.1);
    }

    .ticket.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .dow {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }

    .dom {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-top: 5px;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .service-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .service-row:hover, .service-row.active {
      border-color: var(--accent);
      background-color: rgba(201, 169, 97, 0.1);
    }

    .service-name {
      display: flex;
      align-items: center;
      font-weight: 600;
    }

    .service-radio {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 50%;
      margin-right: 10px;
      position: relative;
    }

    .service-row.active .service-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: var(--accent);
      border-radius: 50%;
    }

    .service-price {
      font-weight: 700;
      color: var(--accent);
    }

    .side-stack {
      display: flex;
      flex-direction: column;
    }

    .story {
      background-color: var(--primary);
      color: white;
    }

    .story-title {
      font-size: 24px;
      font-weight: 700;
      margin: 15px 0;
    }

    .story-title span {
      color: var(--accent);
    }

    .story p {
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .perks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .perk {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .perk strong {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .barber-art {
      background-color: var(--accent);
      color: var(--primary);
      padding: 30px 0;
      text-align: center;
      font-weight: 800;
      font-size: 24px;
      line-height: 1.3;
      margin: 25px 0;
      border-radius: 12px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .field-error {
      color: var(--error);
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }

    .field-error.visible {
      display: block;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .label {
      font-weight: 600;
    }

    .amount {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .amount span {
      font-size: 16px;
      margin-left: 5
